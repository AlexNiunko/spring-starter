db:
 username: ${username.value:postgres}
 password: 123
 driver: PostgresDriver
 url: postgres:5432
 hosts: localhost,127.0.0.1
 properties:
   first: 123
   second: 567
   third.value: Third
 pool:
  size: 120
  timeout: 10
 pools:
   - size: 1
     timeout: 1
   - size: 2
     timeout: 2
   - size: 3
     timeout: 3
logging:
  file:
    name: alex.log
    path: /
  level:
    root: info
    by.epam.spring.database.pool.ConnectionPool: info
    org.springframework.jdbc.core: trace
spring:
  datasource:
    username: user
    url: jdbc:postgresql://localhost:5432/test
    password: user
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          auto: update
        show_sql: true
      fetch_size: 50
      batch_size: 50
      show-sql: true
